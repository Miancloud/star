<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino App Lab 星座運勢儀</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 620px;
      width: 100%;
      background: #1e1e2e;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; color: #64b5f6; }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    select, button {
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }
    select { flex: 1; background: #2c2c3e; color: white; }
    button.primary { background: #64b5f6; color: #000; font-weight: bold; cursor: pointer; }
    button.primary:hover { background: #42a5f5; }
    .main-content {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .fortune-box {
      flex: 2;
      background: #252538;
      padding: 18px;
      border-radius: 10px;
    }
    .topic-buttons {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .topic-btn {
      background: #33334d;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topic-btn:hover, .topic-btn.active {
      background: #03dac6;
      color: #000;
      font-weight: bold;
    }
    .level-tag {
      font-size: 12px;
      background: rgba(0,0,0,0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .color-badge {
      display: inline-block;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid #fff;
    }
    .led-preview {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .led-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #111;
      border: 1px solid #555;
      transition: 0.3s;
    }
    .status {
      margin-top: 18px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌌 UNO Q 星座運勢燈光儀</h1>
  
  <div class="input-group">
    <select id="zodiacSelect">
      <option value="aries">牡羊座 (Aries)</option>
      <option value="taurus">金牛座 (Taurus)</option>
      <option value="gemini">雙子座 (Gemini)</option>
      <option value="cancer">巨蟹座 (Cancer)</option>
      <option value="leo">獅子座 (Leo)</option>
      <option value="virgo">處女座 (Virgo)</option>
      <option value="libra">天秤座 (Libra)</option>
      <option value="scorpio">天蠍座 (Scorpio)</option>
      <option value="sagittarius">射手座 (Sagittarius)</option>
      <option value="capricorn">摩羯座 (Capricorn)</option>
      <option value="aquarius">水瓶座 (Aquarius)</option>
      <option value="pisces">雙魚座 (Pisces)</option>
    </select>
    <button class="primary" onclick="fetchHoroscope()">查詢今日運勢</button>
  </div>

  <div class="main-content" id="resultArea" style="display:none;">
    <div class="fortune-box">
      <h2 id="signTitle" style="margin-top:0;">ARIES</h2>
      <p><strong>幸運色：</strong><span class="color-badge" id="colorDot"></span><span id="luckyColorName">烈焰紅</span></p>
      <p><strong>目前主題：</strong><span id="currentTopic">整體運勢</span> — <strong>等級 <span id="levelDisplay">0</span> / 4</strong></p>
      
      <div class="led-preview" id="ledPreview">
        <div class="led-dot"></div>
        <div class="led-dot"></div>
        <div class="led-dot"></div>
        <div class="led-dot"></div>
      </div>

      <hr style="border-color: #444; margin: 15px 0;">
      <p id="horoscopeText" style="line-height: 1.6;">載入中...</p>
    </div>

    <div class="topic-buttons">
      <button class="topic-btn active" id="btn-overall" onclick="selectTopic('overall', this)">
        <span>🌟 整體運勢</span><span class="level-tag" id="tag-overall">Lv.0</span>
      </button>
      <button class="topic-btn" id="btn-love" onclick="selectTopic('love', this)">
        <span>❤️ 愛情運勢</span><span class="level-tag" id="tag-love">Lv.0</span>
      </button>
      <button class="topic-btn" id="btn-career" onclick="selectTopic('career', this)">
        <span>💼 事業運勢</span><span class="level-tag" id="tag-career">Lv.0</span>
      </button>
      <button class="topic-btn" id="btn-wealth" onclick="selectTopic('wealth', this)">
        <span>💰 財富運勢</span><span class="level-tag" id="tag-wealth">Lv.0</span>
      </button>
    </div>
  </div>

  <div class="status" id="arduinoStatus">已連線至 Arduino App Lab (192.168.0.106)</div>
</div>

<script>
  let currentData = {
    sign: "ARIES",
    colorName: "烈焰紅",
    rgb: [255, 0, 0],
    levels: { overall: 0, love: 0, career: 0, wealth: 0 }
  };

  async function fetchHoroscope() {
    const sign = document.getElementById("zodiacSelect").value;
    document.getElementById("resultArea").style.display = "flex";
    document.getElementById("horoscopeText").innerText = "正在透過板子獲取今日運勢...";

    const res = await fetch(`/api/horoscope?sign=${sign}`);
    const data = await res.json();
    currentData = data;

    document.getElementById("signTitle").innerText = data.sign;
    document.getElementById("luckyColorName").innerText = data.colorName;
    document.getElementById("colorDot").style.backgroundColor = `rgb(${data.rgb.join(",")})`;
    document.getElementById("horoscopeText").innerText = data.text;

    document.getElementById("tag-overall").innerText = `Lv.${data.levels.overall}`;
    document.getElementById("tag-love").innerText    = `Lv.${data.levels.love}`;
    document.getElementById("tag-career").innerText  = `Lv.${data.levels.career}`;
    document.getElementById("tag-wealth").innerText  = `Lv.${data.levels.wealth}`;

    selectTopic('overall', document.getElementById("btn-overall"));
  }

  async function selectTopic(topic, btnElement) {
    document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
    btnElement.classList.add("active");

    const topicNames = { overall: "整體運勢", love: "愛情運勢", career: "事業運勢", wealth: "財富運勢" };
    const level = currentData.levels[topic];
    const rgbCss = `rgb(${currentData.rgb.join(",")})`;

    document.getElementById("currentTopic").innerText = topicNames[topic];
    document.getElementById("levelDisplay").innerText = level;

    document.querySelectorAll(".led-dot").forEach((dot, idx) => {
      if (idx < level) {
        dot.style.backgroundColor = rgbCss;
        dot.style.boxShadow = `0 0 8px ${rgbCss}`;
      } else {
        dot.style.backgroundColor = "#111";
        dot.style.boxShadow = "none";
      }
    });

    const params = new URLSearchParams({
      sign: currentData.sign,
      level: level,
      r: currentData.rgb[0],
      g: currentData.rgb[1],
      b: currentData.rgb[2]
    });

    await fetch(`/api/led?${params.toString()}`);

    document.getElementById("arduinoStatus").innerText = 
      `✅ 矩陣跑馬燈：${currentData.sign} ｜ RGB 燈珠：亮 ${level} 顆 (${currentData.colorName})`;
  }
</script>

</body>
</html>
